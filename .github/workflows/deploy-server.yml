name: Deploy to Server (domestic / via.micah.vip)

on:
  workflow_run:
    workflows: ["Build VIA definitions"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 生成定义(dist)
        run: |
          npm i --no-save @the-via/reader@1.14.4
          node tools/build-defs.js
      - name: 导出干净站点(含生成的 dist)
        run: |
          git add -A
          git add -f dist
          rm -rf .deploy && mkdir -p .deploy/via.micah.vip
          git archive $(git write-tree) | tar -x -C .deploy/via.micah.vip
          echo "文件数: $(find .deploy/via.micah.vip -type f | wc -l)"
      - name: 上传到新服务器(国内)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.KEY }}
          source: ".deploy/via.micah.vip"
          target: "/www/wwwroot"