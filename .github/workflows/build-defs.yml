name: Build VIA definitions

on:
  push:
    branches: [main]
    paths:
      - 'custom/definitions/**'
      - 'czm/definitions/**'
      - 'definitions/**'
      - 'converted-defs/**'
      - 'tools/build-defs.js'
      - '.github/workflows/build-defs.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 @the-via/reader
        run: npm i --no-save @the-via/reader

      - name: 生成定义
        run: node tools/build-defs.js

      - name: 提交产物
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A dist
          if git diff --cached --quiet; then
            echo "产物无变化，跳过提交"
          else
            git commit -m "chore: 重新生成 VIA 定义 [skip ci]"
            git push
          fi
