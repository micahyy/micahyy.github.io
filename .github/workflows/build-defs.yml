name: Build VIA definitions

on:
  push:
    branches: [main]
    paths:
      - 'czm/**'
      - 'tools/build-defs.js'
      - 'tools/check-dup.js'
      - '.github/workflows/build-defs.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 检查重复 PID/VID
        run: node tools/check-dup.js

      - name: 安装 @the-via/reader
        run: npm i --no-save @the-via/reader@1.14.4

      - name: 生成定义
        run: node tools/build-defs.js

      - name: 提交产物
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A dist
          if git diff --cached --quiet; then
            echo "产物无变化，跳过提交"
          else
            git commit -m "chore: 重新生成 VIA 定义 [skip ci]"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ secrets.SSH_HOST != '' }}
    steps:
      - name: 同步到服务器
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.SSH_SITE_PATH }}
            git pull --ff-only origin main
            # 若需重载静态服务（如 nginx/caddy），取消下一行注释并改服务名
            # sudo systemctl reload nginx
